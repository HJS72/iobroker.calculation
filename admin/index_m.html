<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Berechnungen - ioBroker</title>
    
    <!-- ioBroker Admin CSS -->
    <link rel="stylesheet" type="text/css" href="../../css/admin.css"/>
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
    
    <!-- ioBroker Admin JS -->
    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/admin.js"></script>
    
    <style>
        .calculation-item {
            margin: 10px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        
        .input-group {
            margin-bottom: 10px;
        }
        
        .btn-add-input {
            margin-top: 10px;
        }
        
        .btn-delete {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="m">
        <div class="row">
            <div class="col s12">
                <h3>Berechnungen</h3>
                
                <!-- Formular zum Erstellen neuer Berechnungen -->
                <div class="card">
                    <div class="card-content">
                        <span class="card-title">Neue Berechnung erstellen</span>
                        
                        <div class="input-field">
                            <input type="text" id="calc-name" placeholder="Name der Berechnung">
                            <label for="calc-name">Name</label>
                        </div>
                        
                        <div class="input-field">
                            <select id="calc-type">
                                <option value="simple">Einfache Berechnung</option>
                                <option value="average">Durchschnitt</option>
                                <option value="energy">Energie</option>
                                <option value="sum">Summe</option>
                                <option value="product">Produkt</option>
                            </select>
                            <label>Typ der Berechnung</label>
                        </div>
                        
                        <div id="calc-parameters" class="hidden">
                            <div class="input-field">
                                <input type="number" id="duration" placeholder="Dauer in Millisekunden (Standard: 3600000 = 1 Stunde)">
                                <label for="duration">Dauer für Durchschnitt (ms)</label>
                            </div>
                        </div>
                        
                        <div class="input-field">
                            <select id="operation">
                                <option value="add">Addition (+)</option>
                                <option value="subtract">Subtraktion (-)</option>
                                <option value="multiply">Multiplikation (×)</option>
                                <option value="divide">Division (÷)</option>
                            </select>
                            <label>Operation</label>
                        </div>
                        
                        <div class="input-field">
                            <input type="text" id="output-datapoint" placeholder="Datenpunkt für das Ergebnis">
                            <label for="output-datapoint">Ausgabedatenpunkt</label>
                        </div>
                        
                        <div id="inputs-container">
                            <!-- Eingabedatenpunkte werden dynamisch hinzugefügt -->
                        </div>
                        
                        <button class="btn waves-effect waves-light" id="add-input">+ Eingabedatenpunkt hinzufügen</button>
                        <button class="btn waves-effect waves-light" id="save-calculation">Berechnung speichern</button>
                    </div>
                </div>
                
                <!-- Liste der vorhandenen Berechnungen -->
                <div class="card">
                    <div class="card-content">
                        <span class="card-title">Vorhandene Berechnungen</span>
                        <div id="calculations-list">
                            <!-- Liste wird dynamisch gefüllt -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // Alle Datenpunkte für die Auswahl
        let allDatapoints = [];
        
        $(document).ready(function() {
            // Initialisiere Materialize-Komponenten
            $('select').formSelect();
            
            // Lade alle Datenpunkte
            loadAllDatapoints();
            
            // Lade vorhandene Berechnungen
            loadCalculations();
            
            // Event-Handler für Typänderung
            $('#calc-type').on('change', function() {
                if ($(this).val() === 'average') {
                    $('#calc-parameters').removeClass('hidden');
                } else {
                    $('#calc-parameters').addClass('hidden');
                }
            });
            
            // Event-Handler für Eingabedatenpunkt hinzufügen
            $('#add-input').on('click', function() {
                addInputField();
            });
            
            // Event-Handler zum Speichern der Berechnung
            $('#save-calculation').on('click', function() {
                saveCalculation();
            });
        });
        
        function loadAllDatapoints() {
            // Lade alle Datenpunkte aus ioBroker
            socket.emit('getStates', function(err, data) {
                if (!err && data) {
                    allDatapoints = [];
                    for (const id in data) {
                        if (data[id].common && data[id].common.type) {
                            allDatapoints.push({
                                id: id,
                                name: data[id].common.name || id,
                                type: data[id].common.type
                            });
                        }
                    }
                    // Aktualisiere die Dropdowns
                    updateInputDropdowns();
                }
            });
        }
        
        function loadCalculations() {
            // Lade alle Berechnungen aus dem Adapter
            socket.emit('getState', 'calculation.calculations', function(err, data) {
                if (!err && data && data.val) {
                    const calculations = JSON.parse(data.val);
                    displayCalculations(calculations);
                } else {
                    displayCalculations([]);
                }
            });
        }
        
        function displayCalculations(calculations) {
            const container = $('#calculations-list');
            container.empty();
            
            if (calculations.length === 0) {
                container.append('<p>Keine Berechnungen vorhanden</p>');
                return;
            }
            
            calculations.forEach(function(calc) {
                const item = $('<div class="calculation-item">');
                item.append('<h5>' + calc.name + '</h5>');
                item.append('<p>Type: ' + calc.type + '</p>');
                item.append('<p>Output: ' + (calc.output ? calc.output.datapoint : 'N/A') + '</p>');
                
                if (calc.inputs && calc.inputs.length > 0) {
                    item.append('<p>Eingabedatenpunkte:</p><ul>');
                    calc.inputs.forEach(function(input) {
                        item.append('<li>' + input.datapoint + '</li>');
                    });
                    item.append('</ul>');
                }
                
                const actions = $('<div>');
                actions.append('<button class="btn waves-effect waves-light" onclick="editCalculation(\'' + calc.id + '\')">Bearbeiten</button>');
                actions.append('<button class="btn waves-effect waves-light red btn-delete" onclick="deleteCalculation(\'' + calc.id + '\')">Löschen</button>');
                item.append(actions);
                
                container.append(item);
            });
        }
        
        function addInputField() {
            const container = $('#inputs-container');
            const inputGroup = $('<div class="input-group">');
            
            inputGroup.append('<label>Eingabedatenpunkt:</label>');
            inputGroup.append('<select class="input-datapoint"><option value="">Datenpunkt auswählen</option></select>');
            
            container.append(inputGroup);
            
            // Fülle die Dropdowns mit allen Datenpunkten
            updateInputDropdowns();
        }
        
        function updateInputDropdowns() {
            $('.input-datapoint').each(function() {
                const select = $(this);
                select.empty();
                select.append('<option value="">Datenpunkt auswählen</option>');
                
                allDatapoints.forEach(function(dp) {
                    select.append('<option value="' + dp.id + '">' + dp.name + ' (' + dp.id + ')</option>');
                });
            });
        }
        
        function saveCalculation() {
            const name = $('#calc-name').val();
            const type = $('#calc-type').val();
            const operation = $('#operation').val();
            const outputDatapoint = $('#output-datapoint').val();
            
            // Sammle alle Eingabedatenpunkte
            const inputs = [];
            $('.input-datapoint').each(function() {
                const datapoint = $(this).val();
                if (datapoint) {
                    inputs.push({
                        datapoint: datapoint
                    });
                }
            });
            
            // Sammle Parameter
            let parameters = {};
            if (type === 'average') {
                const duration = $('#duration').val();
                if (duration) {
                    parameters.duration = parseInt(duration);
                }
            }
            
            if (!name || !outputDatapoint || inputs.length === 0) {
                alert('Bitte alle Felder ausfüllen');
                return;
            }
            
            // Speichere die Berechnung
            const calculationData = {
                name: name,
                type: type,
                inputs: inputs,
                output: {
                    datapoint: outputDatapoint
                },
                operation: operation,
                parameters: parameters
            };
            
            // Hier würde man normalerweise eine API-Anfrage an den Adapter senden
            alert('Berechnung gespeichert!');
            
            // Leere das Formular
            $('#calc-name').val('');
            $('#output-datapoint').val('');
            $('#inputs-container').empty();
        }
        
        function editCalculation(id) {
            alert('Bearbeiten der Berechnung mit ID: ' + id);
            // Implementierung der Bearbeitungsfunktion
        }
        
        function deleteCalculation(id) {
            if (confirm('Möchten Sie diese Berechnung wirklich löschen?')) {
                // Lösche die Berechnung
                alert('Berechnung gelöscht!');
            }
        }
    </script>
</body>
</html>
