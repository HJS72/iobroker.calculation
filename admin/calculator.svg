<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#4CAF50"/>
  <rect x="10" y="10" width="80" height="80" fill="#FFF" rx="5"/>
  <rect x="20" y="20" width="60" height="60" fill="#F5F5F5" rx="3"/>
  
  <!-- Calculator keys -->
  <rect x="25" y="25" width="15" height="15" fill="#E0E0E0" rx="2"/>
  <rect x="45" y="25" width="15" height="15" fill="#E0E0E0" rx="2"/>
  <rect x="65" y="25" width="15" height="15" fill="#E0E0E0" rx="2"/>
  
  <rect x="25" y="45" width="15" height="15" fill="#E0E0E0" rx="2"/>
  <rect x="45" y="45" width="15" height="15" fill="#E0E0E0" rx="2"/>
  <rect x="65" y="45" width="15" height="15" fill="#E0E0E0" rx="2"/>
  
  <rect x="25" y="65" width="15" height="15" fill="#E0E0E0" rx="2"/>
  <rect x="45" y="65" width="15" height="15" fill="#E0E0E0" rx="2"/>
  <rect x="65" y="65" width="15" height="15" fill="#E0E0E0" rx="2"/>
  
  <!-- Equals sign -->
  <rect x="45" y="80" width="15" height="10" fill="#FF9800" rx="2"/>
  
